<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务维护中 - IISquare.com</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4edf5 100%);
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .header {
            margin-bottom: 30px;
        }
        
        .icon {
            font-size: 64px;
            color: #4a6cf7;
            margin-bottom: 20px;
            display: inline-block;
            animation: pulse 2s infinite;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 32px;
            font-weight: 700;
        }
        
        .subtitle {
            color: #7f8c8d;
            font-size: 18px;
            margin-bottom: 30px;
        }
        
        .message-box {
            background: #f8f9fa;
            border-left: 4px solid #4a6cf7;
            padding: 20px;
            text-align: left;
            margin: 30px 0;
            border-radius: 0 8px 8px 0;
        }
        
        .message-box p {
            margin-bottom: 15px;
            font-size: 16px;
        }
        
        .contact-info {
            margin: 30px 0;
            padding: 20px;
            background: #f0f7ff;
            border-radius: 8px;
        }
        
        .contact-info h3 {
            color: #2c3e50;
            margin-bottom: 15px;
        }
        
        .email-link {
            display: inline-flex;
            align-items: center;
            background: #4a6cf7;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        
        .email-link:hover {
            background: #3a5bd9;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(74, 108, 247, 0.3);
        }
        
        .email-link i {
            margin-right: 8px;
        }
        
        .additional-info {
            margin-top: 30px;
            color: #7f8c8d;
            font-size: 14px;
        }
        
        .decoration {
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: rgba(74, 108, 247, 0.05);
            z-index: 0;
        }
        
        .decoration-1 {
            top: -100px;
            right: -100px;
        }
        
        .decoration-2 {
            bottom: -100px;
            left: -100px;
        }
        
        .actions {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        
        .btn {
            padding: 12px 24px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .btn-primary {
            background: #4a6cf7;
            color: white;
        }
        
        .btn-secondary {
            background: transparent;
            color: #4a6cf7;
            border: 1px solid #4a6cf7;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
            100% {
                transform: scale(1);
            }
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 26px;
            }
            
            .actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="decoration decoration-1"></div>
        <div class="decoration decoration-2"></div>
        
        <div class="header">
            <div class="icon">
                <i class="fas fa-tools"></i>
            </div>
            <h1>服务维护中</h1>
            <p class="subtitle">服务暂时不可用，系统正在紧急修复。</p>
        </div>
        
        <div class="message-box">
            <p>由于数据量较大、请求量过高，服务暂不可用。</p>
            <p>我们正在紧急升级硬件资源，以为您提供更加稳定、优质的服务。</p>
        </div>
        
        <div class="contact-info">
            <h3>获取帮助</h3>
            <p>如果您有紧急问题需要处理，请通过以下方式联系我们的支持团队：</p>
            <a href="mailto:iisquare163@gmail.com" class="email-link">
                <i class="fas fa-envelope"></i> iisquare163@gmail.com
            </a>
        </div>
        
        <div class="additional-info">
            <p>感谢您的理解与耐心等待，请稍后刷新页面查看最新状态。</p>
        </div>
        
        <div class="actions">
            <a href="/" class="btn btn-primary">
                <i class="fas fa-home"></i> 返回首页
            </a>
            <a href="javascript:location.reload()" class="btn btn-secondary">
                <i class="fas fa-refresh"></i> 刷新页面
            </a>
        </div>
    </div>
    
    <script>
        // 添加一些简单的交互效果
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.querySelector('.container');
            
            // 添加简单的入场动画
            container.style.opacity = '0';
            container.style.transform = 'translateY(20px)';
            
            setTimeout(() => {
                container.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
                container.style.opacity = '1';
                container.style.transform = 'translateY(0)';
            }, 100);
            
            // 为按钮添加点击效果
            const buttons = document.querySelectorAll('.btn');
            buttons.forEach(button => {
                button.addEventListener('click', function(e) {
                    this.style.transform = 'scale(0.95)';
                    setTimeout(() => {
                        this.style.transform = '';
                    }, 200);
                });
            });
        });
    </script>
</body>
</html>
